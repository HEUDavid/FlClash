name: build-android

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  IS_STABLE: 'true'
  FLUTTER_VERSION: '3.44.4'
  APP_NAME: 'FkAd'

jobs:
  build:
    name: Build Android
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } >> android/local.properties
          fi
          if [ -n "${{ secrets.SERVICE_JSON }}" ]; then
            echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Apply Branding
        run: dart lib/custom/apply_branding.dart --app-name "${{ env.APP_NAME }}"

      - name: Setup
        run: dart setup.dart android --env stable -v

      - name: Copy latest apk
        run: cp dist/*android-arm64-v8a.apk dist/latest.apk

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Latest
          tag_name: latest
          files: ./dist/*

      - name: Upload latest APK to Gitee Release
        uses: wes-lin/action-gitee-release@v1
        with:
          token: ${{ secrets.GITEE_TOKEN }}
          repository: 'fk-ad/pub'
          name: Latest
          tag_name: latest
          body: 'Latest release build'
          files: dist/latest.apk
          branch: master