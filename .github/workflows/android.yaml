name: build-android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IS_STABLE: 'true'
  FLUTTER_VERSION: '3.44.4'
  APP_NAME: 'BlockAd' # 可在此处修改你打包生成的 App 显示名称
  PACKAGE_NAME: 'com.blockad.app' # 可在此处修改你的独立 Android 包名 (Application ID)

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Replace App Name & Package Name
        run: |
          echo "Replacing app name to ${{ env.APP_NAME }} and package name to ${{ env.PACKAGE_NAME }}..."
          # 1. 替换 Android 包名 (Application ID)
          sed -i "s/applicationId = \"com.follow.clash\"/applicationId = \"${{ env.PACKAGE_NAME }}\"/g" android/app/build.gradle.kts
          # 2. 替换 Flutter 侧应用名称常量
          sed -i "s/const appName = 'FlClash';/const appName = '${{ env.APP_NAME }}';/g" lib/common/constant.dart
          # 3. 替换 Android 主 Application 与 Tile 开关 Label
          sed -i "s/android:label=\"FlClash\"/android:label=\"${{ env.APP_NAME }}\"/g" android/app/src/main/AndroidManifest.xml
          # 4. 替换 Android Debug 模式 Label
          sed -i "s/android:label=\"FlClash Debug\"/android:label=\"${{ env.APP_NAME }} Debug\"/g" android/app/src/debug/AndroidManifest.xml
          # 5. 替换 Android 原生字符串资源
          sed -i "s/<string name=\"FlClash\">FlClash<\/string>/<string name=\"FlClash\">${{ env.APP_NAME }}<\/string>/g" android/common/src/main/res/values/strings.xml
          # 6. 替换前台通知服务标题
          sed -i "s/setContentTitle(\"FlClash\")/setContentTitle(\"${{ env.APP_NAME }}\")/g" android/service/src/main/java/com/follow/clash/service/modules/NotificationModule.kt
          # 7. 替换通知默认参数标题
          sed -i "s/val title: String = \"FlClash\"/val title: String = \"${{ env.APP_NAME }}\"/g" android/service/src/main/java/com/follow/clash/service/models/NotificationParams.kt
          # 8. 替换 VPN 连接会话 Session 名称
          sed -i "s/setSession(\"FlClash\")/setSession(\"${{ env.APP_NAME }}\")/g" android/service/src/main/java/com/follow/clash/service/VpnService.kt



      - name: Setup Android Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } >> android/local.properties
          else
            echo "No custom keystore provided, using default signing."
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart android --env stable -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  release:
    name: Release
    needs: [ build ]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          name: artifact-android

      - name: Generate sha256
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
